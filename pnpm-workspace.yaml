packages:
  - packages/*
allowBuilds:
  esbuild: false
overrides:
  # RCB-159: GHSA esbuild <0.28.1 (Dependabot alert 1, dev-only). tsup 8.5.1 still asks for
  # ^0.27.0, so only an override lifts it; vite 8 already accepts ^0.28.0.
  esbuild: ^0.28.1
  # RCB-189: undici <8.10.2 (Dependabot alerts 5-9, 12, 13; dev-only: jsdom 30.0.1 -> undici
  # ^8.9.0). `pnpm update -r --depth Infinity undici` left the lockfile at 8.10.1, so an override.
  undici: ^8.10.2
  # RCB-226: GHSA-68fv-2mgg-jv7q source-map-js <1.2.2 (Dependabot alert 2, dev-only: tsup, vite,
  # css-tree via jsdom, magicast). `pnpm update -r --depth Infinity source-map-js` left 2 of 3
  # lockfile entries at 1.2.1, so an override.
  source-map-js: ^1.2.2
